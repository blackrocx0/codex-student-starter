page_type_and_mood:
  prompt: >
    {頁面類型、用途與情緒}

visual_base_2a:
  background:
    color: "{HEX}"
    texture: >
      {背景材質、漸層或深淺變化}
    bleed: "none"

  typography:
    heading:
      color: "{HEX}"
      family: "{字體}"
      weight: "{粗細}"
      size_pt: "{數值或範圍}"
    body:
      color:
        - "{HEX}"
      family: "{字體}"
      weight: "{粗細}"
      size_pt: "{數值或範圍}"
      line_spacing: "normal"

  color_system:
    primary:
      color: "{HEX}"
      usage:
        - "{用途}"
    secondary:
      color: "{HEX}"
      usage:
        - "{用途}"
    accent:
      color: "{HEX}"
      usage:
        - "{小面積用途}"
    support:
      - color: "{HEX}"
        usage:
          - "{用途}"

  illustration_style:
    type: "{扁平插畫|3D風格|線條圖示|抽象藝術|無}"
    note: >
      {使用方式}

corner_decoration_2b:
  rule: >
    {取自 Layout 的裝飾限制}
  "{zone_name}":
    decoration: >
      {取自 Theme vocabulary 並符合 Layout zone}

layout_description:
  structure: "{取自 Layout}"
  title_region:
    horizontal_range: "{範圍}"
    vertical_range: "{範圍}"
    description: "{說明}"
  body_region:
    horizontal_range: "{範圍}"
    vertical_range: "{範圍}"
    description: "{說明}"
  image_column: "none"
  alignment_rule: "{取自 Layout}"

content:
  "{field_name}": "{依本次任務現寫}"

safe_zone_constraints:
  hard_constraint: >
    All primary content must stay within 10%–90% of both horizontal and vertical range.
  edge_rule: "No primary content touches or crosses the slide edge."
  exception: >
    背景材質可以滿版；高對比裝飾不得進入主要文字區。

closing_design_intent:
  prompt: >
    {最終視覺原則與讀者印象}
