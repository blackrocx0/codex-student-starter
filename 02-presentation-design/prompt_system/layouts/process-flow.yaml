id: process-flow
display_name: 橫向流程
family: 流程類
safe_area: [10, 10, 90, 90]

slots:
  - id: title
    region: [10, 10, 80, 10]
    role: primary_message

  - id: subtitle
    region: [10, 21, 80, 7]
    role: supporting_message

  - id: steps
    region: [10, 36, 80, 38]
    role: equal_modules
    note: 3–5 個等權重流程節點，每個節點包含短標題與一句說明

  - id: closing_note
    region: [10, 82, 80, 8]
    role: supporting_note

alignment_rules:
  - 標題與副標共用水平中心軸
  - 所有流程節點等寬、等高並共用基線
  - 連接線維持由左至右的單一閱讀方向
  - 標題區底端與流程區頂端至少保留投影片高度 5% 的留白

decoration:
  design_zone: 四周邊界與節點之間的留白，不進入文字框
  free_zone:
    rule: 使用低對比點陣與小面積工作坊標記，不壓過流程節點
    zones:
      - top_left
      - bottom_right

visual_balance:
  method: equal-modules
  description: 流程步驟為平行節點，除非內容明確標示關鍵步驟，否則視覺權重一致
