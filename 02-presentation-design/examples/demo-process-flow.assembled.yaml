page_type_and_mood:
  prompt: >
    教學型橫向流程頁，清楚、溫暖且可立即執行，協助第一次使用 Codex 的學員理解啟動順序。

visual_base_2a:
  background:
    color: "#F7F3EA"
    texture: >
      暖白底帶有由左上向右下的極淡米色漸層，疊加低對比紙張顆粒，
      讓留白有層次但不干擾文字。
    bleed: "none"

  typography:
    heading:
      color: "#253238"
      family: "Noto Sans TC"
      weight: "bold"
      size_pt: "34-42"
    body:
      color:
        - "#253238"
        - "#66756F"
      family: "Noto Sans TC"
      weight: "regular"
      size_pt: "18-22"
      line_spacing: "generous"

  color_system:
    primary:
      color: "#253238"
      usage:
        - 主標、正文與流程節點標題
    secondary:
      color: "#66756F"
      usage:
        - 次要文字、連接線與卡片邊框
    accent:
      color: "#E58B6B"
      usage:
        - 步驟編號與小面積關鍵標記
    support:
      - color: "#D8E2D5"
        usage:
          - 流程卡片的柔和背景

  illustration_style:
    type: "線條圖示"
    note: >
      每個流程節點可使用一個同粗細線條圖示，圖示只協助辨識，不建立第二視覺主角。

corner_decoration_2b:
  rule: >
    裝飾只使用四周邊界與流程節點之間的留白，採低對比點陣與小面積標記，
    不進入標題、說明文字或流程卡片的文字框。
  top_left:
    decoration: >
      以約 18% 不透明度放置小範圍暖灰點陣，維持輕量背景節奏。
  bottom_right:
    decoration: >
      放置三條短手寫感線段與兩個珊瑚色小圓點，作為流程完成的視覺收尾。

layout_description:
  structure: "上方置中標題與副標，中段三個等權重節點由左至右連接，下方放一行提醒。"
  title_region:
    horizontal_range: "10%-90%"
    vertical_range: "10%-28%"
    description: "主標與副標共用中心軸，主標較大，副標不加底色色塊。"
  body_region:
    horizontal_range: "10%-90%"
    vertical_range: "36%-74%"
    description: "三張等寬等高流程卡片共用基線，以單向箭頭連接。"
  image_column: "none"
  alignment_rule: "所有流程節點等權重；標題區與流程區之間保留至少 8% 投影片高度的淨空。"

content:
  title: "三步啟動你的 Codex 工作框架"
  subtitle: "先在本地跑通，再按需求連接外部工具"
  steps:
    - number: "01"
      title: "下載"
      description: "將 GitHub repository clone 到目前資料夾"
    - number: "02"
      title: "檢查"
      description: "執行 bootstrap、doctor 與資安掃描"
    - number: "03"
      title: "使用"
      description: "用自然語言選擇 Wiki、行程或簡報模組"
  closing_note: "外部 Connector 預設關閉；需要同步時再授權。"

safe_zone_constraints:
  hard_constraint: >
    All primary content must stay within 10%–90% of both horizontal and vertical range.
  edge_rule: "No primary content touches or crosses the slide edge."
  exception: >
    暖白背景、淡色漸層與紙張紋理可以滿版；高對比裝飾不得進入主要文字區。

closing_design_intent:
  prompt: >
    讓學員第一眼看懂啟動順序，第二眼知道每一步的具體行動；
    畫面有教學現場的溫度，但所有裝飾都服從流程理解與投影可讀性。
